name: build-release

on:
  push:
    tags: ["**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aarch64-macos:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: macos-26
      target: aarch64-macos
      build_type: release
